<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <section>
        <div class="container my-2">
            <form id="ticket-form" class="row g-3">
                <div class="col-4">
                    <label for="name-input">Nome e cognome</label>
                    <input id="name-input" class="form-control" type="text" name="name-input" required>
                </div>
                <div class="col-4">
                    <label for="km-input">Chilometri di viaggio previsti</label>
                    <input id="km-input" class="form-control" type="number" name="km-input" required>
                </div>
                <div class="col-4">
                    <label for="age-input">Fascia d'età</label>
                    <select id="age-input" class="form-select" name="age-input" required>
                        <option value="Maggiorenne">Maggiorenne</option>
                        <option value="Minorenne">Minorenne</option>
                        <option value="Over 65">Over 65</option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-center gap-2">
                    <button class="btn btn-primary">Invia</button>
                    <button class="btn btn-primary">Annulla</button>
                </div>
            </form>
        </div>
    </section>


<script src="./js/script.js"></script>
</body>
</html>
