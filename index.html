<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="bg-danger">
    <header class="container my-2">
       <h1 class="text-white">Boolean Train System</h1> 
    </header>

    <section>
        <div class="container text-center my-4">
            <h2 class="text-white mb-4">Calcola il prezzo del tuo biglietto</h2>
            <form id="ticket-form" class="row g-3 border rounded text-danger fs-4 bg-light py-3">
                <div class="col-4">
                    <label for="name-input">Nome e cognome</label>
                    <input id="name-input" class="form-control" type="text" name="name-input" required>
                </div>
                <div class="col-4">
                    <label for="km-input">Chilometri di viaggio previsti</label>
                    <input id="km-input" class="form-control" type="number" name="km-input" required>
                </div>
                <div class="col-4">
                    <label for="age-input">Fascia d'età</label>
                    <select id="age-input" class="form-select" name="age-input" required>
                        <option value="Maggiorenne">Maggiorenne</option>
                        <option value="Minorenne">Minorenne</option>
                        <option value="Over 65">Over 65</option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-center gap-2">
                    <button class="btn btn-primary">Invia</button>
                    <button class="btn btn-primary">Annulla</button>
                </div>
            </form>

            <div id="ticket-price" class="row row-cols-5 my-5 d-none">
                <div>
                    <h4>Nome passeggero</h3>
                    <p id="passenger-name"></p>
                </div>
                <div>
                    <h4>Offerta</h4>
                    <p id="plan"></p>
                    </div>
                <div>
                    <h4>Carrozza</h4>
                    <p id="Carrozza">5</p>
                    </div>
                <div>
                    <h4>Codice CP</h4>
                    <p>92911</p>
                    </div>
                <div>
                    <h4>Costo biglietto</h4>
                    <p id="price"></p>
                    </div>

            </div>
        </div>
    </section>


<script src="./js/script.js"></script>
</body>
</html>
